<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Decision Matrix Advisor</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(160deg, #f0e6ff 0%, #dcc9ff 100%);
    font-family: system-ui, sans-serif; color: #3f1e5c;
    display: flex; justify-content: center; padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 680px; }
  .tie { font-size: 2rem; text-align: center; margin-bottom: 4px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #3f1fa8; font-weight: 800; text-align: center; }
  .subtitle { color: #604585; margin-bottom: 20px; font-size: 0.9rem; text-align: center; }
  .card { background: #faf7ff; border: 3px dashed #6b3fd9; border-radius: 20px; padding: 26px; }
  .field-group { margin-bottom: 18px; }
  .field-group h3 { font-size: 0.85rem; color: #6b3fd9; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.03em; }
  .field-row { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type=text] {
    flex: 1; padding: 10px 12px; border-radius: 10px; border: 2px solid #6b3fd9;
    background: #fff; color: #3f1e5c; font-family: inherit; font-size: 0.95rem;
  }
  button.small { padding: 8px 14px; border-radius: 10px; border: none; background: #e4d6ff; color: #3f1fa8; font-weight: 700; cursor: pointer; }
  button.action {
    padding: 12px 28px; border: none; border-radius: 999px; font-size: 1rem; font-weight: 700;
    font-family: inherit; cursor: pointer; background: #6b3fd9; color: #fff; box-shadow: 0 5px 0 #3f1fa8;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #3f1fa8; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #604585; min-height: 1.2em; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; background: #fff; border-radius: 12px; overflow: hidden; }
  th, td { padding: 10px 12px; border-bottom: 1px solid #eee0ff; text-align: center; font-size: 0.88rem; }
  th { background: #e4d6ff; color: #3f1fa8; }
  td:first-child, th:first-child { text-align: left; font-weight: 700; }
  tr.top td { background: #f2ffe8; }
  .total-col { font-weight: 800; color: #3f1fa8; }
  .recommendation { background: #fff; border: 2px solid #d9c6ff; border-radius: 14px; padding: 16px; margin-top: 16px; line-height: 1.5; }
  .footer-note { color: #604585; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #e0d4f5; border-top-color: #6b3fd9; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tie">📊</div>
    <h1>QVAC Decision Matrix Advisor</h1>
    <p class="subtitle">List your options and what matters to you. Get an AI-scored matrix and a recommendation.</p>

    <div class="card">
      <div class="field-group">
        <h3>Options (2-4)</h3>
        <div id="optionsList"></div>
        <button class="small" id="addOption">+ Add option</button>
      </div>
      <div class="field-group">
        <h3>Criteria that matter (2-4)</h3>
        <div id="criteriaList"></div>
        <button class="small" id="addCriterion">+ Add criterion</button>
      </div>
      <div style="text-align:center;"><button class="action" id="generateBtn">Score My Decision</button></div>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const optionsList = document.getElementById('optionsList');
    const criteriaList = document.getElementById('criteriaList');
    const addOption = document.getElementById('addOption');
    const addCriterion = document.getElementById('addCriterion');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    function addRow(container, placeholder) {
      const inputs = container.querySelectorAll('input');
      if (inputs.length >= 4) return;
      const row = document.createElement('div');
      row.className = 'field-row';
      row.innerHTML = `<input type="text" placeholder="${placeholder}" />`;
      container.appendChild(row);
    }

    addRow(optionsList, 'Option A, e.g. job offer at Company X');
    addRow(optionsList, 'Option B, e.g. job offer at Company Y');
    addRow(criteriaList, 'Criterion 1, e.g. salary');
    addRow(criteriaList, 'Criterion 2, e.g. work-life balance');

    addOption.addEventListener('click', () => addRow(optionsList, 'Another option...'));
    addCriterion.addEventListener('click', () => addRow(criteriaList, 'Another criterion...'));

    function collect(container) {
      return Array.from(container.querySelectorAll('input')).map(i => i.value.trim()).filter(Boolean);
    }

    async function generate() {
      const options = collect(optionsList);
      const criteria = collect(criteriaList);
      if (options.length < 2 || criteria.length < 2) {
        status.textContent = 'Please fill in at least 2 options and 2 criteria.';
        return;
      }
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Scoring each option... this may take a moment.';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ options, criteria }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        const headerCells = data.criteria.map(c => `<th>${escapeHtml(c)}</th>`).join('');
        const rows = data.matrix.map(row => `
          <tr class="${row.option === data.topOption ? 'top' : ''}">
            <td>${escapeHtml(row.option)}</td>
            ${data.criteria.map(c => `<td>${row.scores[c]}</td>`).join('')}
            <td class="total-col">${row.total}</td>
          </tr>
        `).join('');

        resultBox.innerHTML = `
          <table>
            <thead><tr><th>Option</th>${headerCells}<th>Total</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="recommendation"><strong>Recommendation:</strong><br>${escapeHtml(data.recommendation)}</div>
        `;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
